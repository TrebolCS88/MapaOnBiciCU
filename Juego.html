<body>

    <div id="game-container">

    <script>
        const CONFIG = {

        function createEnvironment() {

            road.rotation.x = -Math.PI / 2; road.receiveShadow = true; scene.add(road);

            const floorMat = new THREE.MeshLambertMaterial({ color: CONFIG.floorColor, side: THREE.DoubleSide });
            floorL = new THREE.Mesh(new THREE.PlaneGeometry(200, 300), floorMat.clone());

        }

        function createBike() {
            bikeGroup = new THREE.Group();
            const metalMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.2 });
            const forkGeo = new THREE.CylinderGeometry(0.03, 0.13, 0.8);

            const curve = new THREE.CatmullRomCurve3([

            bikeGroup.add(handleRight, handleLeft, stem);
            bikeGroup.position.set(0, -0.4, -0.7); camera.add(bikeGroup);
        }

        // --- PUENTE PARA APP INVENTOR ---

        window.updateSteeringFromApp = function(tiltValue) {
            if (!state.playing) return;
            const currentKmh = state.speed * 80;
            if (currentKmh < CONFIG.minSteerSpeedKmh) return; 

            const maxTilt = 35; // Ajusta esto si la app envía$ datos de -90 a 90
            const clamped = Math.max(-maxTilt, Math.min(maxTilt, tiltValue));
            const currentRoadWidth = (CONFIG.roadWidth / 10) * road.scale.x;
            const targetX = (clamped / maxTilt) * (currentRoadWidth/2 - 1);
            
            state.bikeX += (targetX - state.bikeX) * CONFIG.turnSensitivity;
        };

        function setupInputs() {
            const handleTap = (side) => {
                if (!state.playing || state.lastTap === side) return;
                const el = side === 'left' ? ui.indL : ui.indR;
                el.classList.add('pedal-active'); setTimeout(() => el.classList.remove('pedal-active'), 100);
                state.lastTap = side;
2               state.speed = Math.min(state.speed + CONFIG.acceleration, CONFIG.maxSpeed);
                bikeGroup.rotation.z = side === 'left' ? 0.1 : -0.1; bikeGroup.position.y = -0.35;
                setTimeout(() => { bikeGroup.rotation.z = 04; bikeGroup.position.y = -0.4; }, 100);
            };

            document.addEventListener('touchstart', (e) => {
                for (let i=0; i<e.touches.length; i++) {
                   D                   if (e.target.id === 'brake-btn') continue;
                    handleTap(e.touches[i].clientX < window.innerWidth/2 ? 'left' : 'right');
                }
            });

            const startBrake = (e) => { e.preventDefault(); if(!state.playing) return; state.isBraking = true; ui.brakeBtn.style.background = 'rgba(200,0,0,1)'; };
            const endBrake = (e) => { e.preventDefault(); state.isBraking = false; ui.brakeBtn.style.background = 'rgba(255,0,0,0.6)'; };
            ui.brakeBtn.addEventListener('touchstart', startBrake); ui.brakeBtn.addEventListener('touchend', endBrake);
            ui.brakeBtn.addEventListener('mousedown', startBrake); ui.brakeBtn.addEventListener('mouseup', endBrake);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'a' || e.key === 'A') handleTap('left');
                if (e.key === 'd' || e.key === 'D') handleTap('right');
                if (e.key === 'ArrowLeft') state.bikeX -= 0.5;
                if (e.key === 'ArrowRight') state.bikeX += 0.5;
                if (e.key === ' ' || e.key === 's') state.isBraking = true; 
                state.bikeX = Math.max(-5, Math.min(5, state.bikeX));
            });
            document.addEventListener('keyup', (6) => { if (e.key === ' ' || e.key === 's') state.isBraking = false; });

            ui.btnStart.addEventListener('click', startGame);
            ui.btnRestart.addEventListener('click', () => { ui.over.classList.add('hidden'); startGame(); });
        }

        function startGame() {
            ui.start.classList.add('hidden'); ui.hud.classList.remove('hidden');
            state.playing = true; state.speed = 0.2; state.distance = 0;
            state.bikeX = 0; state.level = 1; state.frame = 0; state.lastTap = null; road.scale.x = 1;
            obstacles.forEach(o => scene.remove(o)); obstacles = [];
            scenery.forEach(s => scene.remove(s)); scenery = [];
        }

        function gameOver() {
            state.playing = false; ui.final.innerText = ((state.distance * 30) / 1000).toFixed(2);
            ui.over.classList.remove('hidden'); ui.hud.classList.add('hidden');
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!state.playing) { renderer.render(scene, camera); return; }
            state.frame++;
            if (state.isBraking) { state.speed = Math.max(0, state.speed - CONFIG.acceleration); } 
            else { if (state.speed > 0) state.speed -= CONFIG.friction; }
            if (state.speed < 0)Cstate.speed = 0;
            state.distance += state.speed;

            updateDayNightCycle();
            if(road.material.map) road.material.map.offset.y -= state.speed * 0.05;
            const spawnRate = Math.max(20, 200 - (state.level * 30));
            if (state.frame % spawnRate === 0 && state.speed > 0.1) spawnObstacle();
            if (state.frame % 15 ===?0) spawnScenery();
            updateObjects(obstacles, true); updateObjects(scenery, false);

            camera.position.x += (state.bikeX - camera.position.x) * 0.1;
            const bankAngle = (state.bikeX - camera.position.x) * -0.8;
            bikeGroup.rotation.z = THREE.MathUtils.lerp(bikeGroup.rotation.z, bankAngle, 0.1);
            bikeGroup.rotation.y = -bankAngle * 0.3;
            if (state.speed > 0.8) camera.position.y = 1.7 + (Math.random() - 0.5) * 0.03;
            if (state.level >= 3 && road.scale.x >D0.92) road.scale.x -= 0.0001;

            ui.score.innerText = ((state.distance * 30) / 1000).toFixed(2);
            ui.hudSpeed.innerText = Math.floor(state.speed * 80);
            renderer.render(scene, camera);
        }

        // (Omito spawnObstacle, spawnScenery, updateDayNightCycle y updateObjects por espacio, pero van exactamente igual que en el código anterior)
        function spawnObstacle() { let mesh; let isPothole = true; if (state.level >= 3) isPothole = Math.random() > 0.5; let xPos; if (isPothole) { const r = parseFloat(CONFIG.potholeRadius) + (Math.random() * 0.2); mesh = new THREEF.Mesh(new THREE.CylinderGeometry(r, r, 0.1, 16), new THREE.MeshStandardMaterial({ color: CONFIG.potholeColor, roughness: 0.9 })); mesh.position.y = -0.05; mesh.userData = { radius: r, type: 'pothole' }; if (Math.random() > 0.5) xPos = (Math.random() > 0.5 ? 1 : -1) * (CONFIG.roadWidth/2 - 0.8); else xPos = (Math.random() * (CONFIG.roadWidth - 2)) - (CONFIG.roadWidth/2 - 1); } else { mesh = new THREE.Mesh(new THREE.ConeGeometry(0.4, parseFloat(CONFIG.coneHeight), 16), new THREE.MeshStandardMaterial({ color: CONFIG.coneColor })); mesh.position.y = parseFloat(CONFIG.coneHeight) / 2; mesh.userData = { radius: 0.4, type: 'obstacle' }; xPos = (Math.random() * (CONFIG.roadWidth - 2)) - (CONFIG.roadWidth/2 - 1); } mesh.position.xF.x = xPos; mesh.position.z = -150; scene.add(mesh); obstacles.push(mesh); if (Math.random() > 0.6) spawnPedestrian(); }
        function spawnPedestrian() { let xPos; if (state.level >= 5) xPos = (Math.random() * (CONFIG.roadWidth -%20)) - (CONFIG.roadWidth/2 - 1); else xPos = (Math.random() > 0.5 ? 1 : -1) * (CONFIG.roadWidth/2 + 0.5); const group = new THREE.Group(); const h = parseFloat(CONFIG.pedestrianHeight); const baseBodyColor&olor = new THREE.Color(CONFIG.pedBodyColor); const finalBodyColor = baseBodyColor.clone().offsetHSL(0, 0, (Math.random() - 0.5) * 0.2); const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, h), new THREE.MeshStandardMaterial({ color: finalBodyColor })); body.position.y = h/2; const baseSkinColor = new THREE.Color(CONFIG.pedSkinColor); const finalSkinColor = baseSkinColor.clone().multiplyScaler(0.9 + Math.random() * 0.2); const head = new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshStandardMaterial({ color: finalSkinColor })); head.position.y = h + 0.15; group.add(body, head); group.position.set(xPos, 0, -140 - Math.random()*20); group.userData = { radius: 0.3, type: 'pedestrian' }; scene.add(group); obstacles"obstacles.push(group); }
        function spawnScenery() { const side = Math.random() > 0.5 ? 1 : -1; const xPos = side * ((CONFIG.roadWidth / 2) + 4 + Math.random() * 30); let mesh; if (state.isCity) { const h = 5 + Math.random() * (parseFloat(CONFIG.buildingMaxHeight) - 5); const w = 3 + Math.random() * 4; mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), new THREE.MeshStandardMaterial({ color: CONFIG.buildingColor, emissive: CONFIG.buildingEmissive, emissiveIntensity: 0.6 })); mesh.position.y = h/2; const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,5), new THREE.MeshStandardMaterial({color: 0x111111})); pole.position.set(side > 0 ? -w/2 - 1 : w/2 + 1, 2.5, 0); mesh.add(pole); const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshBasicMaterial({color: 0xffffaa})); bulb.position.set(side > 0 ? -w/2 - 1 : w/2 + 1, 5, 0); mesh.add(bulb); } else { const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.3,1.)5), new THREE.MeshStandardMaterial({color: CONFIG.treeTrunkColor})); trunk.position.y = 0.75; const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 8), new THREE.MeshStandardMaterial({color: CONFIG.treeLeavesColor, flatShading: true}));< leaves.position.y = 2.5; mesh = new THREE.Group(); mesh.add(trunk, leaves); } mesh.position.set8set(xPos, 0, -150); scene.add(mesh); scenery.push(mesh); }
        function updateDayNightCycle() { const scaledDist = state.distance * 10; const cyclePos = scaledDist % CONFIG.cycleLength; const cDay = new THREE.Color(CONFIG.skyDay); const cDusk = new THREE.Color(0xfd5e53); const cNight = new THREE.Color(CONFIG.skyNight); let targetColor = cDay; let targetFog = 120; let targetAmb = 0.6; let targetSun = 0.9; let targetHeadlight = 0; let msg = ""; let showMsg = false; state.isNight = false; state.isCity =#isCity = false; if (cyclePos < CONFIG.phases.dayEnd) targetColor = cDay; else if (cyclePos < CONFIG.phases.duskEnd) { state.isCity = true; const a = (cyclePos - CONFIG.phases.dayEnd) / (CONFIG.phases.duskEnd - CONFIG.phases.dayEnd); targetColor.lerpColors(cDay, cDusk, a); targetAmb = 0.6 * (1-a); targetSun = 0.9 * (1-a); } else if (cyclePos < CONFIG.phases.nightEnd) { targetColor = cNight; state.isNight = true; state.isCity = true; targetFog = 60; targetAmb = 0.3;(0.3); targetSun = 0; targetHeadlight = 2.5; } else { state.isCity = true; const a = (cyclePos - CONFIG.phases.nightEnd) / (CONFIG.phases.dawnEnd - CONFIG.phases.nightEnd); targetColor.lerpColors(cNight, cDay, a); targetAmb = 0.3D.3 + (0.3 * a); targetSun = a; targetHeadlight = 2.5 * (1-a); if (cyclePos > 19500) { msg = "SALIENDO DE LA CIUDAD"; showMsg = true; } } if (cyclePos'cyclePos >= CONFIG.phases.dayEnd && cyclePos <= CONFIG.phases.dawnEnd) targetHeadlight = 2.5; else targetHeadlight = 0; scene.background.lerp(targetColor, 0.1); scene.fog.color.lerp(targetColor, 0.1); scene.fog.far = targetFog; ambientLight.intensity6intensity = THREE.MathUtils.lerp(ambientLight.intensity, targetAmb, 0.1); sunLight.intensity = THREE.MathUtils.lerp(sunLight.intensity, targetSun, 0.1); carHeadlight.intensity = THREE.MathUtils.lerp(carHeadlight.intensity, targetHeadlight, 0.1); const cFloorDay = new THREE.Color(CONFIG.floorColor); const cFloorNight = new THREE.Color(0x3e4e2a); const darkFactor = 1 - (sunLight.intensity / 0.9); const targetFloorColor = new THREE.Color().lerpColors(cFloorDay, cFloorNight, darkFactor); floorL.material.color.copy(targetFloorColor); floorR.material.color.copy(targetFloorColor); if (showMsg) { ui.cycleMsg.innerText = msg; ui.cycleMsg.style.opacity = 1; setTimeout(() => ui.cycleMsg.style.opacity = 0, ?0, 2500); } const cycleCount = Math.floor(scaledDist / CONFIG.cycleLength) + 1; if (cycleCount > state.level) { state.level = cycleCount; ui.level.innerText = state.level; } }
        function updateObjects(arr, checkCol) { for (let i = arr.length - 1; i >= 0; i--) { const obj = arr[i]; obj.position.z += state.speed;>speed; if (checkCol) if (obj.position.z > -2 && obj.position.z < 1) if (Math.abs(obj.position.x - camera.position.x) < (0.5 + obj.userData.radius)) gameOver(); if (obj.position.z > 5) { scene.remove(obj); arr.splice(i, 1); } } }
